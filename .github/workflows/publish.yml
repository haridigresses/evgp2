name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write   # npm provenance and trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false   # never cache in release builds
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Uses trusted publishing (OIDC) once it is configured on npmjs.com; until then, the
      # NPM_TOKEN secret. Delete the secret after trusted publishing is set up.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
